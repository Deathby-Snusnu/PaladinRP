name: PaladinRP 0.8.0 spellbook
on:
  push:
  pull_request:
jobs:
  spellbook-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python static and content contracts
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Install Lua 5.1 and 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.1 lua5.4
      - name: WoW mock runtime in Lua 5.1
        run: lua5.1 tests/test_addon.lua
      - name: WoW mock runtime in Lua 5.4
        run: lua5.4 tests/test_addon.lua
